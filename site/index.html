<!doctype html>
<!-- The inline background is deliberate: the canvas must be black from the FIRST
     BYTE. A self-update reload (the hourly version poll below) builds a brand new
     document, and until css/main.css arrives the browser paints its own default
     white — on a board that reads as the screen blanking to white and coming
     back. A background on the root element paints before any stylesheet request
     resolves, so there is nothing to flash. CSP allows inline style ATTRIBUTES
     (style-src 'unsafe-inline'), which is why this is not a <script>. Deliberately
     NOT paired with <meta name="color-scheme" content="dark">: that would also
     restyle every native control (checkboxes, time inputs) on the setup pages. -->
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src https: blob:; connect-src 'self' https: wss:; frame-src https://monitor.ui.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<!-- The layout is a fixed 1920x1080 box (see main.css), and `width=1920` keeps
     that the layout viewport on any engine that honors this tag. It is a
     constant on purpose: `device-width` would hand the engine back the very
     number it computes wrong below.

     `initial-scale=1` has now been removed once and put back once, and both
     halves of that history are load-bearing:

       2026-07-25 REMOVED. Pinning the scale at 1:1 left a smaller RoomOS panel
         (a Room Navigator, 1280x800 of glass) showing only the top-left
         ~1280px of the page and needing a pinch to read. Dropping it let
         Blink shrink-to-fit the 1920 layout onto the panel for free, and that
         was a no-op on a Board Pro, whose device width is already 1920.

       2026-08-26 RESTORED. That free fit is computed wrong on the RoomOS
         reload path. Navigating a live QQuickWebEngineView IN PLACE, which is
         every location.reload() this app does (a settings save, an activation
         code, the hourly version poll, the 4 AM refresh, the watchdog), makes
         Blink select an initial page scale of exactly 2 on a Board Pro, i.e.
         devicePixelRatio, so the board comes back magnified with a quarter of
         the content visible and stays that way until someone wakes the device.
         Measured over CDP on a Desk Pro G2 (RoomOS ce26.9): visualViewport
         .scale 2 with browser zoom 1 and a correct 1920x1040 layout viewport,
         reproducible from a programmatic reload with no touch input at all.
         docs/signage-zoom-bug.md carries the full account.

     The engine's discretion IS the bug, so this tag takes it away, and the fit
     the Navigator needs moved into util.js fitViewport(), which measures the
     VISUAL viewport instead of trusting the engine to have fitted anything.
     Both halves are required: alone, this tag is the 2026-07-25 regression and
     that function is the 2026-08-26 one. `maximum-scale=1` is a second lock on
     the same bug, since the initial scale is clamped to it. `minimum-scale` is
     deliberately absent (a small panel must still be allowed to shrink) and
     `user-scalable` deliberately unused: the pinch is refused in main.css
     (touch-action) and js/zoomguard.js, which is where that reasoning lives. -->
<meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1">
<title>idlescreen</title>
<!-- A board's dashboard is nothing a search result should land on: the page is
     empty chrome until a config arrives, and what a stranger searching for
     idlescreen wants is the guide at idlescreen.io. noindex rather than a
     robots.txt Disallow, because a crawler has to FETCH a page to read this
     tag; a disallowed URL can still be listed from links, just blind. The setup
     pages and the audit harnesses carry the same line for the same reason. -->
<meta name="robots" content="noindex">
<!-- Warm the two hosts every board talks to before the module graph has even
     parsed: the API worker (transit, markets, news, …) and Open-Meteo, which
     the Weather card in the default layout fetches browser-direct. Both are
     CORS fetches, so both hints are `crossorigin` — that is the connection
     pool the fetches will actually reuse. Third-party per-widget hosts are
     deliberately NOT listed: a preconnect a board never uses is a wasted
     socket on a stack that has few to spare. -->
<link rel="preconnect" href="https://api.roomboard.app" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<!-- SVG first for anything that takes one; the 32px PNG is the fallback and the
     touch icon must stay a PNG, which iOS is the only consumer of. All three are
     the small master except the touch icon, which uses the full one at a size
     where four cards still read. -->
<link rel="icon" type="image/svg+xml" href="assets/idlescreen-quad.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/idlescreen-favicon-32.png">
<link rel="apple-touch-icon" href="assets/idlescreen-icon-180.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main id="app">
    <header id="topbar" class="topbar"></header>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="ambient" class="ambient" hidden>
      <div id="backdrop" class="backdrop" hidden></div>
      <div id="slideshow" class="slideshow"></div>
      <div id="clockface" class="clockface" hidden></div>
      <div id="strip" class="strip"></div>
    </section>
    <section id="welcome" class="welcome" hidden></section>
    <button id="edit" class="gear gear--edit" aria-label="Edit layout"></button>
    <button id="gear" class="gear" aria-label="Settings"></button>
    <div id="settings-root"></div>
    <div id="edit-root"></div>
  </main>
  <!-- Classic script, and it MUST stay ahead of the module below: it exists to
       catch a broken/stale static import that stops main.js's module graph from
       executing at all, which a guard inside that graph could never detect. -->
  <script src="js/bootguard.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
