<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings audit harness</title>
<meta name="robots" content="noindex"><!-- not a search landing; see index.html -->
<link rel="stylesheet" href="css/main.css">
<style>
  /* #app keeps main.css's fixed 1920x1080 PAGE, which is what .settings sizes
     against (position:absolute inset:0 inside a position:relative #app) — so the
     pane geometry here is the shipped geometry at every device height. What the
     device changes is only how much of that page its SCREEN shows: 1040 on a
     Board Pro (measured on-device 2026-07-28), 1200 on a Room Navigator, 1080 in
     a desktop preview. ?vh= draws that edge; the rail's 52px bottom padding is
     what keeps its footer above the board's. */
  html, body { margin: 0; overflow: auto; }
  #app { width: 1920px; height: 1080px; position: relative; background: var(--bg); }
  #fold { position: absolute; left: 0; width: 1920px; height: 0; z-index: 98;
    border-top: 1px dashed rgba(255,120,120,.9); pointer-events: none; }
  #fold::after { content: attr(data-label); position: absolute; right: 6px; top: 2px;
    font: 11px monospace; color: rgba(255,150,150,.95); }
  #audit-meta { position: fixed; right: 8px; bottom: 8px; z-index: 99; font: 12px monospace;
    color: #93a0b4; background: rgba(13,17,23,.9); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
  <div id="app"><div id="settings-root"></div><div id="fold"></div></div>
  <div id="audit-meta"></div>
<script>
  // Deterministic captures: ?freeze=<epochMs> pins Date so before/after
  // pixel-diffs aren't polluted by the live clock / world-clock rows.
  (() => {
    const f = new URLSearchParams(location.search).get('freeze');
    if (!f) return;
    const fixed = Number(f);
    const RealDate = Date;
    class FrozenDate extends RealDate {
      constructor(...a) { a.length ? super(...a) : super(fixed); }
      static now() { return fixed; }
    }
    FrozenDate.parse = RealDate.parse;
    FrozenDate.UTC = RealDate.UTC;
    window.Date = FrozenDate;
  })();
</script>
<script type="module">
  import { openSettings, SECTION_IDS } from './js/settings/settings.js';
  import { normalizeConfig, DEFAULT_CONFIG } from './js/config.js';

  const q = new URLSearchParams(location.search);
  const section = q.get('section') ?? '';
  const VIEWPORTS = { 1040: 'Board Pro', 1200: 'Room Navigator', 1080: 'desktop preview' };
  const vh = Number(q.get('vh') ?? 1040);
  const fold = document.getElementById('fold');
  fold.style.top = `${vh}px`;
  fold.dataset.label = `${vh}px — bottom of the ${VIEWPORTS[vh] ?? 'UNSUPPORTED'} screen`;
  // Single theme since the 2026-07-19 fold — no body class needed.
  // main.js publishes the running version here from its hourly version.json
  // poll; the harness never boots main.js, so it stands one in. The default is
  // a full 12-character build id — the widest string the pane's colophon, the
  // one place a board states its version, will ever have to seat.
  window.__signage = { version: q.get('build') ?? 'fa395c8b41d2' };
  const cfg = normalizeConfig(structuredClone(DEFAULT_CONFIG));
  // ?iptv=1 places the advanced Live Video card, which is the 15th (and
  // last-possible) nav row — the worst case for the rail's height budget.
  if (q.get('iptv')) cfg.layout.push({ id: 'iptv', x: 0, y: 0, w: 3, h: 3 });
  // ?tickers=N seeds the Markets list with N symbols (the reorder pane's list
  // column is the one control in settings whose height is user-driven, so 1,
  // 2, 12 and the 20 cap all need measuring). ?markets=WxH resizes the card so
  // the fold band moves; ?markets=off takes the card off the board entirely.
  const n = Number(q.get('tickers') ?? 0);
  if (n) {
    const pool = ['^DJI', '^IXIC', '^GSPC', 'AAPL', 'MSFT', 'NVDA', 'CSCO', 'TSLA', 'AMZN', 'CBG.L',
      'SAP.DE', '7203.T', 'GOOGL', 'META', 'NFLX', 'AMD', 'INTC', 'ORCL', 'CRM', 'ADBE'];
    cfg.markets.symbols = pool.slice(0, Math.min(n, pool.length));
  }
  const m = q.get('markets');
  if (m === 'off') cfg.layout = cfg.layout.filter((r) => r.id !== 'markets');
  else if (m) {
    const [mw, mh] = m.split('x').map(Number);
    cfg.layout = cfg.layout.map((r) => (r.id === 'markets' ? { ...r, w: mw, h: mh } : r));
  }
  // ?configured=1 renders the photo panes in their album-connected state.
  if (q.get('configured')) {
    cfg.photos.album = 'B1m5fk75vLWwX';
    cfg.gdrivephotos.album = '1RHow60mcBwzMturimQSbziK3hqCvP2lz';
  }
  await openSettings(cfg, {});

  // Navigate to the requested section: click its nav item; if it's a group
  // child, open groups until it appears.
  if (section) {
    const find = () => document.querySelector(`.settings__nav [data-section="${section}"]`);
    if (!find()) {
      for (const g of document.querySelectorAll('.settings__nav .settings__navgroup')) {
        g.click();
        await new Promise((r) => setTimeout(r, 120));
        if (find()) break;
      }
    }
    find()?.click();
  }
  // ?whatsnew=1 opens the rail footer's What's new pane; &expand=1 also opens
  // its earlier-updates drawer. The pane is not a NAV_MODEL section, so ?section=
  // cannot reach it.
  if (q.get('whatsnew')) {
    document.querySelector('.settings__whatsnew')?.click();
    await new Promise((r) => setTimeout(r, 400));
    if (q.get('expand')) document.querySelector('.settings__pane [data-log-more]')?.click();
  }

  // Anything the device's screen cannot reach. The rail footer and the pane's
  // last control are the two that have ever come close, so they are named rather
  // than counted.
  const below = (sel) => [...document.querySelectorAll(sel)]
    .map((el) => [el.className.split(' ')[0], Math.round(el.getBoundingClientRect().bottom - vh)])
    .filter(([, d]) => d > 0);
  // The rail's own scroll budget. The nav is the only part of the rail allowed
  // to scroll, and the footer must never need to: overflow > 0 here means the
  // rail is one row taller than the page can seat it.
  const scrollOf = (sel) => {
    const el = document.querySelector(sel);
    if (!el) return null;
    return { sh: el.scrollHeight, ch: el.clientHeight, over: Math.max(0, el.scrollHeight - el.clientHeight) };
  };
  const toggle = document.querySelector('.settings__pane [data-log-more]');
  window.__sections = SECTION_IDS;
  window.__audit = {
    section: section || (q.get('whatsnew') ? 'whatsnew' : '(default)'), deviceH: vh, device: VIEWPORTS[vh] ?? 'UNSUPPORTED',
    winH: window.innerHeight,
    railBottom: Math.round(document.querySelector('.settings__rail')?.getBoundingClientRect().bottom ?? 0),
    footBottom: Math.round(document.querySelector('.settings__railfoot')?.getBoundingClientRect().bottom ?? 0),
    nav: scrollOf('.settings__nav'),
    pane: scrollOf('.settings__pane'),
    openGroups: document.querySelectorAll('.settings__pane .log > .log__group').length,
    hiddenGroups: document.querySelectorAll('.settings__pane .log__more > .log__group').length,
    toggleBottom: toggle ? Math.round(toggle.getBoundingClientRect().bottom) : null,
    tickers: cfg.markets.symbols.length,
    tkList: scrollOf('.settings__pane .tk-list'),
    // The keypad's last key is the control the one-column layouts pushed off
    // the pane; if it clears the screen edge, the two columns are paying off.
    keypadBottom: (() => {
      const rows = document.querySelectorAll('.settings__pane .osk__row');
      const last = rows[rows.length - 1];
      return last ? Math.round(last.getBoundingClientRect().bottom) : null;
    })(),
    belowFold: below('.settings__rail > *, .settings__pane > *, .settings__navitem, .settings__navgroup'),
  };
  // ?nometa=1 for screenshots: the readout is fixed to the bottom-right and
  // would otherwise sit on top of the rail footer, which is the one part of
  // this surface that lives on the last visible pixels.
  document.getElementById('audit-meta').textContent =
    `${JSON.stringify(window.__audit)} · all: ${SECTION_IDS.join(' ')}`;
  if (q.get('nometa')) document.getElementById('audit-meta').hidden = true;
</script>
</body>
</html>
