"_128\":164,\"_61\":62,\"_63\":9,\"_64\":165},{\"_51\":141,\"_52\":142,\"_10\":11,\"_25\":143,\"_53\":66,\"_54\":144,\"_55\":145,\"_56\":146,\"_57\":147,\"_58\":147,\"_59\":60,\"_128\":148,\"_61\":62,\"_63\":9,\"_64\":149},{\"_51\":118,\"_52\":119,\"_10\":11,\"_25\":120,\"_53\":121,\"_54\":122,\"_55\":123,\"_56\":124,\"_57\":125,\"_58\":125,\"_59\":60,\"_61\":62,\"_63\":9,\"_64\":126},{\"_51\":107,\"_52\":108,\"_10\":11,\"_25\":109,\"_53\":110,\"_54\":111,\"_55\":112,\"_56\":113,\"_57\":114,\"_58\":115,\"_59\":60,\"_61\":62,\"_63\":9,\"_64\":116},{\"_51\":98,\"_52\":99,\"_10\":11,\"_25\":100,\"_53\":101,\"_54\":102,\"_55\":103,\"_56\":104,\"_57\":105,\"_58\":105,\"_59\":60,\"_61\":62,\"_63\":9,\"_64\":106},{\"_51\":88,\"_52\":89,\"_10\":11,\"_25\":90,\"_53\":91,\"_54\":92,\"_55\":93,\"_56\":94,\"_57\":95,\"_58\":96,\"_59\":60,\"_61\":62,\"_63\":9,\"_64\":97},{\"_51\":79,\"_52\":80,\"_10\":11,\"_25\":81,\"_53\":67,\"_54\":82,\"_55\":83,\"_56\":84,\"_57\":85,\"_58\":86,\"_59\":60,\"_61\":62,\"_63\":9,\"_64\":87},{\"_51\":69,\"_52\":70,\"_10\":11,\"_25\":71,\"_53\":67,\"_54\":72,\"_55\":73,\"_56\":74,\"_57\":75,\"_58\":76,\"_59\":60,\"_61\":62,\"_63\":9,\"_64\":77},\"id\",\"contentId\",\"subtitle\",\"description\",\"urlPath\",\"coveredGeos\",\"released\",\"updated\",\"premium\",false,\"compliance\",\"FreelyAccessible\",\"language\",\"sources\",\"Statista Consumer Insights\",\"Sponsored post by Booking.com\",\"Halloween\",\"Pew Research Center\",\"infographic-36738\",\"36738\",\"Horror Slays at the Box Office\",\"This chart shows the share of North American box office revenue brought in by horror movies. Horror movies are making a comeback, bringing in more than 15 percent of Canadian and U.S. box office proceeds in 2025. In 2026, this number already stands at 14.6 percent even before the big Halloween rush, making it likely that last year's peak we will surpassed. This is according to data by websites The Numbers and Molten Cloud. Hits like Sinners and Weapons carried the genre as did franchises, for example The Conjuring, Insidious, Final Destination, Five Nights at Freddy's and even the return of Scream, now on its seventh movie. The horror boom is happening at the same time as the recovery of box\",\"/chart/36738/share-of-north-american-box-office-revenue-brought-in-by-horror-movies/\",{},\"2026-10-28T15:58:17Z\",\"2026-10-28T16:22:21Z\",[78],\"the-numbers.com\",\"infographic-31146\",\"31146\",\"Chills and Thrills: Where Horror Rules the Screen\",\"This chart shows the share of respondents who watch or stream \\\"horror\\\" movies/series/videos on TV or online. With Halloween just around the corner and spooky content ramping up on TV and streaming platforms, which nations are most likely to watch horror movies or shows? A Statista Consumer Insights survey conducted between October 2025 and September 2026 found that in Mexico, almost half of respondents say they like to watch horror movies or shows, around as many as in India, Malaysia and the Philippines. In an interview with NPR, Edwin Pagan, who runs LatinHorror.com, theorizes that a lot of Latinos watch the genre because many of the stories children hear growing up incorporate the superna\",\"/chart/31146/share-of-respondents-who-watch-or-stream-%22horror%22/\",{},\"2023-10-30T09:54:05Z\",\"2026-10-28T16:58:47Z\",[65],\"infographic-27506\",\"27506\",\"Inflation Concerns Down From Peak, But Still Elevated\",\"Global Inflation\",\"This chart shows the share of respondents who believe that inflation is one of the most important problems in their country. Inflation has become an increasingly common concern around the world. While sensitivity around the issue is staying elevated among consumers in a majority of countries surveyed by Statista Consumer Insights, worry about inflation is now lower than it was in 2023, the year after the Russian invasion of Ukraine. Inflation already started to rise around the world in 2021 due to pandemic-era supply disruptions and culminated in the 2022/23 energy crisis due to the Ukraine war. However, in the years that followed, inflation pressures continued to arise in the form of U.S. t\",\"/chart/27506/fears-of-inflation-by-country/\",{},\"2022-05-23T14:55:36Z\",\"2026-10-29T09:28:51Z\",[65],\"infographic-36743\",\"36743\",\"Usage Gap: Will AI Tools Amplify Educational Differences?\",\"AI Usage\",\"This chart shows AI tool adoption in the U.S. by education level. In theory, AI has the potential to be a great equalizer by giving people access to vast amounts of knowledge, unlockable with a couple of questions, all at the pace and level of complexity determined by the user. However, for that to work, access to AI tools and basic AI training must be equitable – otherwise AI could even widen existing gaps, as non-users could be left behind early in the transition to an AI-centric future. According to recent findings from Statista Consumer Insights, there is a real risk of such a knowledge gap quickly opening up. The data shows that AI tool adoption rises with education levels. For example,\",\"/chart/36743/ai-tool-adoption-by-education-level/\",{},\"2026-10-30T10:28:14Z\",[65],\"infographic-36744\",\"36744\",\"Anthropic’s Massive Compute Commitments\",\"Anthropic\",\"This chart shows Anthropic's compute and infrastructure commitments as laid out in the company's S-1 filing. On Monday, Anthropic filed the paperwork for what could end up being the largest initial public offering to date. The registration filing, a whopping 335-page document, provides the public with a rare glimpse into the inner workings of a leading frontier AI model provider, laying open the immense potential of the still nascent technology as well as the near-incalculable risks associated with pushing AI further and further. Financially, the filing reveals exponential growth, steep losses and a clear path towards profitability. Anthropic’s revenue grew from $41 million in 2023 to $16.3 \",\"/chart/36744/anthropics-compute-and-infrastructure-commitments/\",{},\"2026-10-30T14:28:57Z\",\"2026-10-30T15:27:38Z\",[117],\"Anthropic, PBC\",\"infographic-36763\",\"36763\",\"Where Housing Costs Weigh Most on Households\",\"Sponsored Post by Booking.com\",\"This infographic shows the share of people whose housing costs exceed 40% of their disposable income, by country (EU). Housing affordability is uneven across the EU, according to Eurostat. Across the EU-27, an average of 8.2 percent of people spend more than 40 percent of their disposable income on housing. That figure masks considerable differences between countries: Greece stands out at 28.9 percent, while Croatia is at the other end of the spectrum at just 3.7 percent. These differences can have an influence on labor mobility and local quality of life. In countries where housing takes up a disproportionately large share of income, workers in low-wage sectors such as hospitality may face p\",\"/chart/36763/where-housing-costs-weigh-most-on-households/\",{},\"2026-11-09T16:47:07Z\",[127],\"Eurostatica\",\"coveredTimeframe\",\"displayText\",\"2010 - 2026\",\"start\",\"2010-01-01\",\"end\",\"2026-12-31\",\"2025 - 2026\",\"2026-09-30\",\"2026\",\"2026-01-01\",\"2026-08-31\",\"2026-10-31\",\"infographic-36777\",\"36777\",\"How International and Domestic Visitors Spend their Money\",\"This infographic shows the breakdown of spending by travelers who booked via booking.com across the EU, UK and Switzerland in 2025. Travelers who booked through Booking.com spent a similar share of their money on hospitality whether they were traveling internationally or domestically, according to 2025 figures for the EU, UK and Switzerland from Booking.com and Tourism Economics. Hospitality accounted for 44% of international visitors’ spending and 42% of domestic visitors’ spending. The differences are greater in other categories: shopping made up 20% of international spending but only 6% of domestic spending, while entertainment accounted for 10% and 19%, respectively. Domestic visitors al\",\"/chart/36777/how-international-and-domestic-visitors-spend-their-money/\",{},\"2026-11-13T15:56:30Z\",{\"_129\":152,\"_131\":153,\"_133\":154},[150,151],\"Booking.com\",\"Tourism Economics\",\"2025\",\"2025-01-01\",\"2025-12-31\",\"infographic-36781\",\"36781\",\"Americans Want Social Media to Entertain\",\"Social Media\",\"This chart shows the share of U.S. respondents who say they watch/listen/read the following social media content. The content Americans gravitate towards on social media skews heavily towards entertainment. This is the result of a survey by Statista Consumer Insights carried out this year. In it, 42 percent of Americans said they consumed comedy content on social media. The genre has become a widespread one after content creators branched out from lifestyle topics into a wider variety of categories. Another 38 percent of Americans between the ages of 18 and 64 said they consumed social media content to do with movies and TV, while 36 percent said they watched cooking and food content and 34 \",\"/chart/36781/hare-of-u-s-respondents-who-say-they-watch-listen-read-the-following-social-media-content/\",{},\"2026-11-16T14:14:48Z\",\"2026-11-16T14:32:26Z\",{\"_129\":137,\"_131\":138,\"_133\":140},[65],\"infographic-20010\",\"20010\",\"International Enrollment at U.S. Universities Falls\",\"Higher Ed\",\"This chart shows international enrollment in higher education in the 2025/26 academic year. The number of foreign students at U.S. universities has dipped significantly in the 2025/26 academic term, the Open Doors Report on International Education Exchange has revealed. Around 1.15 million international students were enrolled or in post-academic training in the past academic year, down from 1.18 million one year earlier – a decrease of 2.7 percent. Fewer students arrived, for example, from the two countries sending the most enrollees to the U.S. by far, China and India. The Covid-19 pandemic saw international enrollment at U.S. higher education institutions dip majorly, but the number of int\",\"/chart/20010/international-enrollment-in-higher-education/\",{},\"2019-11-20T08:49:37Z\",\"2026-11-16T15:13:31Z\",{\"_129\":135,\"_131\":178,\"_133\":139},[177],\"Institute of International Education\",\"2025-09-01\",\"infographic-25829\",\"25829\",\"News Consumption Rises on TikTok and Instagram\",\"News on social media\",\"This chart shows the share of each social media site’s users who say they regularly get news there. As new data from Pew Research Center shows, 57 percent of U.S. Facebook users regularly consume news on the platform, while just as many X users do the same. These numbers have not drastically changed since 2020. However, other networks have caught up in terms of news consumption over the past six years. Among TikTok users, 53 percent most recently said they regularly got news on the platform, up from just 22 percent, showcasing the app's pivot from its early days of lip-syncing and viral dance content to a much more varied offering today. Similarly, 46 percent of Instagram users said they reg\",\"/chart/25829/most-popular-social-media-sites-for-news/\",{},\"2021-09-23T08:17:05Z\",\"2026-11-16T16:10:06Z\",{\"_129\":190,\"_131\":191,\"_133\":134},[68],\"2020 - 2026\",\"2020-01-01\",\"infographic-31412\",\"31412\",\"Holiday Shopping: ´Tis the Season to Shop Online\",\"This chart shows the share of e-commerce sales in total retail sales in the United States. The holiday season really is the season to shop online. While it’s a long-established fact that retail sales move with the seasons and typically peak in the holiday quarter, e-commerce sales follow the same pattern to an even larger extent. According to data from the U.S. Census Bureau, the share of e-commerce sales in total retail sales is significantly higher in the fourth quarter of each year than it is for the remaining nine months, as online retailers lure gift buyers with shopping events and heavy discounts. In Q4 2025, for example, e-commerce sales amounted to $365 billion, or a record 18.3 perc\",\"/chart/31412/e-commerce-share-in-us-retail-sales/\",{},\"2023-12-11T15:31:05Z\",\"2026-11-17T14:20:04Z\",{\"_129\":130,\"_131\":132,\"_133\":203},[202],\"United States Census Bureau\",\"2026-06-30\",\"infographic-7045\",\"7045\",\"Cyber Week Spending Set to Hit New Highs in 2026\",\"Holiday Shopping\",\"This chart shows Thanksgiving weekend e-commerce sales in the United States. Despite the fact that Black Friday and Cyber Monday discounts are increasingly spread out, with many online retailers already offering early Black Friday deals more than a week before the actual event, both days are expected to see record spending levels once again this year. According to estimates from Adobe Analytics, Cyber Monday will remain the biggest day of the holiday shopping season, with U.S. consumers expected to spend over $15 billion online in a single day for the first time ever. Black Friday online sales are forecast to grow by almost 10 percent to $12.9 billion, while Thanksgiving Day is expected to b\",\"/chart/7045/thanksgiving-weekend-e-commerce-sales/\",{},\"2016-12-01T15:59:09Z\",\"2026-11-17T15:14:43Z\",{\"_129\":137,\"_131\":216,\"_133\":134},[215],\"Adobe\",\"2026-11-01\",\"infographic-35531\",\"35531\",\"Where Americans Expect the Best Deals This Holiday Season\",\"Black Friday\",\"This chart shows the share of U.S. respondents who expect the best deals in the following product categories on Black Friday and Cyber Monday. With Thanksgiving weekend just one week away, shoppers and retailers in the U.S. are gearing up for what typically marks the peak of the holiday shopping season. According to findings from Statista Consumer Insights, consumer appetite for year-end promotions remains exceptionally high, with 69 percent of U.S. adults aged 18 to 64 saying they’ll likely shop on Black Friday (including 43 percent who said \\\"very likely\\\") and 66 percent planning to take advantage of Cyber Monday deals. Despite persistent cost-of-living concerns, spending intentions also lo\",\"/chart/35531/black-friday-product-categories-best-deals-expectations/\",{},\"2025-11-27T17:04:08Z\",\"2026-11-17T15:41:44Z\",{\"_129\":137,\"_131\":228,\"_133\":136},[65],\"2026-09-01\"]\n");</script></div>
