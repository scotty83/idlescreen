name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Site suite (happy-dom) + worker suite (workerd pool).
      - run: npm test

  deploy-site:
    # Publishes the site to the production Pages project (`signage`, which serves
    # idlescreen.app, with unsleep.app and roomboard.app still attached) after
    # tests pass. Push-to-main only, skipped on PRs. Reuses
    # the same `deploy:site` the maintainer used to run by hand; stamp-version.js
    # stamps version.json with the commit SHA so boards self-refresh hourly.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontdoor:
    # Publishes the public guide to the `quadrille-site` Pages project (which
    # serves idlescreen.io and unsleep.io; the project name is two renames old
    # and stays put, since the domains are attached to it) as a build product of the same commit. It was
    # a hand-curled mirror before this job existed and went stale whenever /info
    # shipped. Same gate as deploy-site: push-to-main only, after tests.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The docs (idlescreen.io/docs) are an Astro build with its own dep
      # tree; docs:stage (inside deploy:frontdoor) needs it installed.
      - run: npm ci --prefix docs-site
      - run: npm run deploy:frontdoor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
